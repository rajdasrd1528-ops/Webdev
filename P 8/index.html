<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <header class="navbar">
        <h2>RAJ PROTFOLIO</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1>Welcome to My Portfolio</h1>
            <p>Creative ideas and modern development.</p>
        </section>

        <article class="card" id="about">
            <h2>About My Work</h2>
            <p>I enjoy learning web development and creating projects.</p>

        </article>

        <section class="extra">
            <h2>More Information</h2>
            <p>Scroll down to see more details about my work.</p>
        </section>
    </main>
    
</body>
</html>
